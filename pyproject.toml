[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "cvp-minisign-file-review"
version = "0.1.1"
description = "Minisign prehashed ED detached file and trusted-comment signatures, explicit pinned public key; legacy Ed only with explicit opt-in."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "UPSTREAM_LICENSE"]
readme = "README.md"
dependencies = ["cryptography==50.0.2", "PyNaCl==1.6.2"]
[project.scripts]
minisign-file-review = "minisign_file_review.cli:entry"
[tool.setuptools.packages.find]
where = ["src"]
